<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>풍경조각 : 토대를 까는 일</title>
<style>html{background:#f4f1ea}@media(prefers-color-scheme:dark){html{background:#161511}}</style>
<script>
  /* 이 사이트는 단일 페이지다. 다른 경로로 들어오면 라벨 페이지로 되돌린다. */
  (function () {
    var target = location.hostname.indexOf('github.io') !== -1 ? '/studio/' : '/';
    if (location.pathname !== target) location.replace(target);
  })();
</script>
</head>
<body><noscript><a href="/studio/">라벨 페이지로 이동</a></noscript></body>
</html>
